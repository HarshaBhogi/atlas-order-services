services:
  api:
    build: .
    command: >
      sh -c "alembic upgrade head && python -m atlas_order_services.seed &&
      uvicorn atlas_order_services.main:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    environment:
      ATLAS_DATABASE_URL: sqlite+pysqlite:////app/data/atlas.db
      ATLAS_DOCUMENT_ROOT: /app/documents
    volumes:
      - atlas-data:/app/data
      - atlas-documents:/app/documents

volumes:
  atlas-data:
  atlas-documents:
